<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu bản thân</title>
</head>
<body>
    <header> 
        <h1>Xin chào, mình là sinh viên CSE122</h1>
        <nav>
            <a href="#gioi-thieu">Giới thiệu</a>
            <a href="#lien-he">Liên hệ</a>
        </nav>
    </header>

    <main>
        <section id="gioi-thieu">
            <article>
                <p> Mình đang học <strong>HTML</strong> và <em>Web ngữ nghĩa</em>
                <ul>
                    <li>
                        Tự gõ code và hiểu từng thẻ
                    </li>

                    <li>
                        Kiểm tra trang web bằng Live Server
                    </li>
                </ul>
                </p>
            </article>
        </section>

        <section id="lien-he">
            <h2>
                Gửi lời nhắn
            </h2>
            <form action="#" method="post">
                <div>
                    <label for="ten">Họ và tên:</label>
                    <input type="text" id="ten" name="ten" placeholder="Ví dụ: Nguyễn Văn A" required>
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="ten@gmail.com" required>
                </div>

                <button type="submit">Gửi đi</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Thực hành HTML cơ bản - CSE!22</p>
    </footer>
</body>
</html>
