<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính Bỏ Túi - Bài Tập Web</title>
    <!-- Giao dien may tinh -->
    <style>
        
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            width: 300px;
        }
        #display {
            width: 100%;
            height: 60px;
            background: #fff;
            font-size: 24px;
            text-align: right;
            padding: 5px 10px;
            box-sizing: border-box;
            border: none;
            border-radius: 6px;
            margin-bottom: 15px;
            color: #333;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #e0e0e0;
            transition: 0.2s;
        }
        button:hover {
            background: #d4d4d4;
        }
        .operator {
            background: #ff9f0a;
            color: white;
        }
        .operator:hover {
            background: #e08e09;
        }
        .clear {
            background: #ff3b30;
            color: white;
        }
        .clear:hover {
            background: #d32f2f;
        }
        .equal {
            background: #34c759;
            color: white;
            grid-column: span 2;
        }
        .equal:hover {
            background: #28a745;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- Màn hình hiển thị kết quả -->
        <input type="text" id="display" readonly value="0">

        <!-- Bàn phím các nút bấm -->
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue(')')">)</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        // Phần xử lý logic bằng JavaScript
        const display = document.getElementById('display');

        function appendValue(val) {
            if (display.value === '0' && val !== '.') {
                display.value = val;
            } else {
                display.value += val;
            }
        }

        function clearDisplay() {
            display.value = '0';
        }

        function calculate() {
            try {
                // Thay thế ký hiệu ×, ÷ thành * hệ thống hiểu được
                let expression = display.value.replace(/×/g, '*').replace(/÷/g, '/');
                // Hàm eval giúp tính toán chuỗi phép tính tự động
                display.value = eval(expression);
            } catch (error) {
                display.value = 'Lỗi cú pháp';
                setTimeout(clearDisplay, 1500);
            }
        }
    </script>

</body>
</html>
